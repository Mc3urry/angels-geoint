<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ANGELS — dossiers</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Two panes: the ranked list, and one candidate in full. The page exists
     to make a discrepancy checkable, so everything that argues AGAINST a
     record gets the same weight as everything that argues for it. See
     routes/dossier.py for what the list deliberately refuses to sort by. */
  body { display:block; height:100vh; overflow:hidden; background:var(--paper); }
  .wrap { display:grid; grid-template-columns:330px 1fr; height:100vh; }
  .list { border-right:1px solid var(--rule); background:#fff;
          overflow-y:auto; }
  .list header { position:sticky; top:0; background:#fff; z-index:2;
                 border-bottom:1px solid var(--rule); padding:12px 14px; }
  h1 { margin:0 0 4px; font:700 12px/1 var(--mono); letter-spacing:.2em; }
  .count { font:10px var(--mono); color:var(--ink-3); letter-spacing:.06em;
           text-transform:uppercase; }
  .row { padding:9px 14px; border-bottom:1px solid #eef2f5; cursor:pointer; }
  .row:hover { background:#f7fafb; }
  .row.on { background:var(--ink); color:#fff; }
  .row.on .sub, .row.on .k { color:#9fb3c2; }
  .row .id { font:11.5px var(--mono); }
  .row .sub { font:10px var(--mono); color:var(--ink-3); margin-top:2px; }
  .s { display:inline-block; width:34px; text-align:right; font:11px var(--mono); }
  .pane { overflow-y:auto; padding:22px 26px 60px; }
  .pane h2 { margin:0 0 2px; font:700 15px var(--mono); letter-spacing:.06em; }
  .warn { border:1px solid #c9a227; background:#fdf8e8; border-radius:3px;
          padding:11px 13px; margin:14px 0 20px;
          font:11.5px/1.65 system-ui,sans-serif; color:#5a4708; }
  .warn b { color:#3d3005; }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
          gap:18px 26px; margin-top:16px; align-items:start; }
  .card { border:1px solid var(--rule); border-radius:3px; background:#fff;
          padding:12px 14px; }
  .card.against { border-color:#b08; border-left:3px solid var(--accent); }
  .card h3 { margin:0 0 8px; font:10px var(--mono); letter-spacing:.1em;
             text-transform:uppercase; color:var(--ink-3); }
  table { border-collapse:collapse; width:100%; }
  td { padding:2.5px 0; font:11.5px/1.45 var(--mono); vertical-align:baseline; }
  td.k { color:var(--ink-3); font-size:9.5px; letter-spacing:.05em;
         text-transform:uppercase; width:118px; padding-right:10px; }
  .chip { background:#0e1a24; border-radius:3px; display:flex;
          align-items:center; justify-content:center; min-height:180px; }
  .chip img { max-width:100%; image-rendering:pixelated; }
  .nochip { font:10.5px var(--mono); color:#6b7c89; padding:26px; }
  ul.why { margin:0; padding-left:16px; }
  ul.why li { font:11.5px/1.6 var(--mono); color:var(--ink-2); }
  .caveats { margin-top:22px; border-top:1px solid var(--rule); padding-top:14px; }
  .caveats li { font:11px/1.6 system-ui,sans-serif; color:var(--ink-3);
                margin-bottom:6px; }
  .pill { display:inline-block; padding:1px 7px; border-radius:9px;
          font:10px var(--mono); border:1px solid var(--rule);
          color:var(--ink-2); }
  .pill.vessel { background:#e7f0fb; border-color:#2a78d6; color:#17508f; }
  .pill.fixed { background:#eef1f3; border-color:#6b7c89; }
  .pill.clutter { background:#fbeae7; border-color:#9b2c1f; color:#7d2318; }
  .pill.ambiguous { background:#fbf3e2; border-color:#7c5412; color:#5f400d; }
  /* The chip could not be read at all -- no ground to judge, which is not
     the same as having judged it and found nothing. Styled apart from
     clutter so the two are never conflated. No chip currently carries this;
     the three that briefly did turned out to be a chipper fault, not an
     unreadable chip. Kept because the category is real and the reporting it
     forced is correct. */
  .pill.no-data { background:#2b2b2b; border-color:#000; color:#fff; }
  .pill.thin, .pill.unheard, .pill.intermittent
        { background:#fbf3e2; border-color:#c9a227; color:#5a4708; }
  .idle { padding:60px 26px; font:12px/1.8 var(--mono); color:var(--ink-3); }
</style>
</head>
<body>
<div class="wrap">
  <div class="list" id="list">
    <header>
      <h1>DOSSIERS</h1>
      <div class="count" id="count">loading…</div>
    </header>
    <div id="rows"></div>
  </div>
  <div class="pane" id="pane"><div class="idle">Pick a candidate.</div></div>
</div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "—").replace(/[<>&]/g, c =>
  ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));
const num = (v, d = 2) => v === null || v === undefined ? "—" : Number(v).toFixed(d);

let META = null, ITEMS = [], current = null;

function rowHtml(it) {
  const lab = it.label ? `<span class="pill ${it.label}">${it.label}</span>` : "";
  const rec = it.reception !== "heard"
    ? `<span class="pill ${it.reception}">${it.reception}</span>` : "";
  return `<div class="row" data-key="${esc(it.key)}">
    <div class="id"><span class="s">${num(it.strength, 2)}</span> ${esc(it.key)}</div>
    <div class="sub">${esc(it.date)} · ${it.length_m_approx ? num(it.length_m_approx, 0) + " m" : "—"}
      · ${esc(it.band)} ${lab} ${rec}</div></div>`;
}

function kv(rows) {
  return `<table>${rows.map(([k, v]) =>
    `<tr><td class="k">${esc(k)}</td><td>${v}</td></tr>`).join("")}</table>`;
}

function render(r) {
  const a = r.assessment, g = r.geography, ais = r.ais, p = r.persistence;
  const near = ais.nearest;
  const lab = a.label
    ? `<span class="pill ${a.label.verdict}">${a.label.verdict}</span>`
    : "not read";
  $("#pane").innerHTML = `
    <h2>${esc(r.key)}</h2>
    <div class="count">${esc(r.date)} · ${num(r.lat, 4)}, ${num(r.lon, 4)}
      · strength ${num(a.strength, 3)}</div>

    <div class="warn">
      <b>What the ranking is and is not.</b> ${esc(META?.ranking_bias?.warning || "")}
    </div>

    <div class="card">
      <h3>why this score</h3>
      <ul class="why">${(a.why || []).map(w => `<li>${esc(w)}</li>`).join("")}</ul>
    </div>

    <div class="grid">
      <div class="card"><h3>what the radar saw</h3>
        ${kv([
          ["SNR", num(r.radar.snr, 1)],
          ["cluster", `${esc(r.radar.pixels)} px`],
          ["length ≈", r.radar.length_m_approx ? num(r.radar.length_m_approx, 1) + " m" : "—"],
          ["position ±", r.radar.uncertainty_m ? num(r.radar.uncertainty_m, 0) + " m" : "—"],
          ["peak / bg", `${num(r.radar.peak_dn, 0)} / ${num(r.radar.background_dn, 1)}`],
          ["scene", `<span style="font-size:9.5px">${esc((r.scene || "").slice(0, 44))}</span>`],
          ["P(vessel)", a.p_vessel === null ? "not scored" : num(a.p_vessel, 3)],
          ["label", lab],
        ])}</div>

      <div class="chip" id="chip"></div>

      <div class="card against"><h3>what AIS said — the case against</h3>
        ${kv([
          ["searched", ais.looked === false ? "<b>NO — no AIS data for this date</b>" : "yes, ±" + (ais.searched_window_s / 60) + " min"],
          ["nearest report", near ? `${num(near.distance_m, 0)} m, ${near.dt_s} s off` : esc(ais.note)],
          ["that vessel", near ? `${esc(near.name || near.mmsi)} · ${near.sog_kn ?? "—"} kn` : "—"],
          ["match radius", r.matching.search_radius_m ? num(r.matching.search_radius_m, 0) + " m" : "—"],
          ["reports in cell", esc(ais.cell_vessels)],
          ["reception", `<span class="pill ${esc(r.reception.class)}">${esc(r.reception.class)}</span>`],
        ])}</div>

      <div class="card against"><h3>has it been here before — the case against</h3>
        ${p && p.near !== false ? kv([
          ["nearest site", num(p.distance_m, 0) + " m"],
          ["seen on", `${esc(p.n_dates_seen)} of ${esc(p.n_dates_searched)} passes`],
          ["hit fraction", num(p.hit_fraction, 2)],
          ["AIS ever matched", String(p.ever_matched)],
          ["first seen", esc(p.first_seen)],
          ["filter verdict", esc(p.verdict)],
        ]) : `<div class='nochip'>Nothing has been detected at this spot on
              any other pass. ${p ? "Nearest known site " + num(p.distance_m, 0)
              + " m away \u2014 far enough to say nothing about this one." : ""}</div>`}
        <div style="margin-top:8px;font:10px/1.5 system-ui,sans-serif;color:#6b7c89">
          The filter calls a site fixed only if it was seen on ≥3 dates, on ≥50%
          of the passes that searched it, <b>and</b> AIS never explained it. A
          berth has reporting vessels on it, so that last condition exempts the
          structures most worth catching.</div>
      </div>

      <div class="card"><h3>where it sits</h3>
        ${kv([
          ["to nearest limit", g.nm_to_any_limit === null ? "—" : num(g.nm_to_any_limit, 2) + " nm"],
          ["to 12 nm line", g.nm_to_12nm === null ? "—" : num(g.nm_to_12nm, 2) + " nm"],
          ["to 24 nm line", g.nm_to_24nm === null ? "—" : num(g.nm_to_24nm, 2) + " nm"],
          ["band", esc(g.band)],
          ["detector strength", esc(g.detector_strength)],
        ])}</div>

      <div class="card"><h3>conditions of the look</h3>
        ${kv([
          ["k sigma", esc(r.look.k_sigma)],
          ["gate", r.look.gate_min_snr == null ? "not recorded"
             : `SNR \u2265 ${esc(r.look.gate_min_snr)}, \u2265 ${esc(r.look.gate_min_pixels)} px`
               + (r.look.gate_source ? `<span style="font-size:9px;color:#6b7c89"> (from ${esc(r.look.gate_source)}; the scene files record no gate)</span>` : "")],
          ["clutter verdict", `<span style="font-size:10px">${esc(r.look.clutter_verdict)}</span>`],
          ["geolocation RMS", r.look.geolocation_rms_m ? num(r.look.geolocation_rms_m, 0) + " m" : "—"],
          ["searched", r.look.searched_km2 ? num(r.look.searched_km2, 0) + " km²" : "—"],
          ["coast blind zone", r.look.coast_blind_m ? num(r.look.coast_blind_m, 0) + " m" : "—"],
        ])}</div>
    </div>

    <div class="caveats"><h3 style="margin:0 0 8px;font:10px var(--mono);
      letter-spacing:.1em;text-transform:uppercase;color:#6b7c89">what this page does not claim</h3>
      <ul>${(r.caveats || []).map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>`;

  const chip = $("#chip");
  if (r.chip) {
    const img = new Image();
    img.alt = r.key;
    img.onerror = () => { chip.innerHTML = "<div class='nochip'>chip failed to load</div>"; };
    img.src = `/dossier/chip/${encodeURIComponent(r.key)}`;
    chip.replaceChildren(img);
  } else {
    chip.innerHTML = `<div class="nochip">No chip was generated for this
      candidate. Chips exist for the ${META ? META.with_chip : "sampled"}
      candidates that were drawn for labelling, not for all ${META ? META.n : ""}.</div>`;
  }
}

async function open_(key) {
  document.querySelectorAll(".row").forEach(el =>
    el.classList.toggle("on", el.dataset.key === key));
  const r = await (await fetch(`/dossier/${encodeURIComponent(key)}`)).json();
  current = r;
  render(r);
}

async function boot() {
  try {
    META = await (await fetch("/dossier/meta")).json();
    const d = await (await fetch("/dossier/list?limit=300")).json();
    ITEMS = d.items;
    $("#count").textContent =
      `${d.total.toLocaleString()} candidates · ${META.with_label} read · ${META.with_chip} with a chip`;
    $("#rows").innerHTML = ITEMS.map(rowHtml).join("");
    $("#rows").addEventListener("click", e => {
      const row = e.target.closest(".row");
      if (row) open_(row.dataset.key);
    });
    if (ITEMS.length) open_(ITEMS[0].key);
  } catch (err) {
    $("#count").textContent = "could not load";
    $("#pane").innerHTML = `<div class="idle">No dossiers. Run
      <code>python scripts/build_dossiers.py</code> first.<br><br>
      ${esc(err.message || err)}</div>`;
  }
}
boot();
</script>
</body>
</html>
