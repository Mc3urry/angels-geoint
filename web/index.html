<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANGELS</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ANGELS</h1>
    <span class="gloss">radar returns with no attributable source</span>

    <!-- Domain filter. Land is present and disabled on purpose: an absent
         control implies the domain was never considered, a disabled one with
         a reason says it was considered and is blocked on sourcing. -->
    <div id="domains">
      <button data-domain="air" class="on">Air</button>
      <button data-domain="sea">Sea</button>
      <button data-domain="land" disabled
              title="Transit and public-fleet GTFS-Realtime. Scoped, not yet built.">Land</button>
    </div>

    <div id="range">
      <button data-hours="1">1h</button>
      <button data-hours="2" class="on">2h</button>
      <button data-hours="6">6h</button>
      <button data-hours="24">24h</button>
    </div>
  </header>

  <div id="map"></div>
  <aside id="panel"><p class="empty">starting…</p></aside>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
