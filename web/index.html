<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANGELS</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ANGELS</h1>
    <span class="gloss">radar returns with no attributable source</span>

    <!-- Domain filter. Land was present and disabled until 2026-10-27, when
         the road collectors had data to show: an absent control would have
         implied the domain was never considered. -->
    <div id="domains">
      <button data-domain="air" class="on">Air</button>
      <button data-domain="sea">Sea</button>
      <button data-domain="land"
              title="Transit vehicles on 38 border feeds, declared work zones and the state lines. Cooperative only; the comparison is not built yet.">Land</button>
    </div>

    <!-- The other evidence class, kept in its own control rather than
         alongside Air/Sea. Air and Sea are DOMAINS of the same cooperative
         feed; this is a different kind of knowing, and putting it in the same
         row of buttons would say the opposite. -->
    <!-- LAND'S TWO LAYERS, shown only while Land is on, each toggled on or
         off on its own: Vehicles (with work zones), and Cameras (Maryland's
         CHART cameras, with a browser and CHART's own player). -->
    <div id="landtabs" hidden>
      <button data-landtab="vehicles" class="on">Vehicles</button>
      <button data-landtab="cameras">Cameras</button>
    </div>

    <div id="layers">
      <button data-layer="observed"
              title="Sentinel-1 radar returns no AIS report explained. Retrospective: hours to days old, twelve days between passes.">Observed &middot; SAR</button>
      <!-- OFF BY DEFAULT. Trails read the archive rather than the live feed,
           and on the national box that is a lot of geometry for a layer most
           sessions do not want. Nothing is fetched at all until it is on. -->
      <button data-layer="trails"
              title="Historical tracks from the archive for the selected box. Off by default; reads the archive, not the live feed.">Trails</button>
    </div>

    <!-- WHICH SKY. Not a zoom control: the two boxes are polled at
         completely different rates, and the map says different things about
         what it knows in each. See the panel's fix-age block. -->
    <div id="boxes">
      <button data-aoi="air" class="on"
              title="DC-Baltimore, polled every 30 s. Positions projected between polls.">DC</button>
      <button data-aoi="conus"
              title="Continental US, polled every 10 minutes. Positions shown where last heard, with an uncertainty ring.">CONUS</button>
    </div>

    <!-- Disabled until Trails is on: a time range for a layer that is not
         drawn is a control that does nothing, which is worse than absent. -->
    <div id="range">
      <button data-hours="1" disabled>1h</button>
      <button data-hours="2" class="on" disabled>2h</button>
      <button data-hours="6" disabled>6h</button>
      <button data-hours="24" disabled>24h</button>
    </div>

    <!-- The 3D ops view: the same API on a globe, with tracking, sensor
         looks and context layers (2026-10-28). -->
    <a id="to-ops" href="ops.html" title="Globe, click-to-track, sensor styles, context layers">3D view &#8599;</a>
  </header>

  <div id="map"></div>
  <aside id="panel"><p class="empty">starting…</p></aside>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
