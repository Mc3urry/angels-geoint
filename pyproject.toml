[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "angels"
version = "0.1.0"
description = "Detecting non-cooperative behaviour in cooperative reporting systems"
requires-python = ">=3.11"

# Core needs nothing. That is deliberate -- it stays fast to import and
# trivial to test. Everything below serves the outer layers.
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pyarrow>=16",
  "duckdb>=1.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
# Phase 4. Heavy geospatial stack, not needed to run the app.
analysis = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pandas>=2.2",
  "numpy>=1.26",
  "esda>=2.5",
  "libpysal>=4.10",
  "pointpats>=2.4",
  "movingpandas>=0.18",
  "matplotlib>=3.8",
]
# Phase 2. The inversion classifier.
ml = ["scikit-learn>=1.4"]
# Phase 3. SAR.
sar = ["rasterio>=1.3"]
# Phase 5.
forensics = ["pvlib>=0.11", "pillow>=10.0"]

dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["angels*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
