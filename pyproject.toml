[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "angels"
version = "0.1.0"
description = "Detecting non-cooperative behaviour in cooperative reporting systems"
requires-python = ">=3.11"

# Core needs nothing. That is deliberate -- it stays fast to import and
# trivial to test. Everything below serves the outer layers.
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pyarrow>=16",
  "duckdb>=1.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  # DECLARED 2026-10-06, having been imported and undeclared since before
  # anyone counted. tests/test_declared_dependencies.py found both on its
  # first run: it reads the import statements with `ast` instead of comparing
  # this file against another file somebody wrote by hand, which is why
  # test_tasks_targets.py could not see them.
  #
  # Both arrived transitively. pydantic because fastapi requires it;
  # websockets because `uvicorn[standard]` happens to include it. A
  # transitive dependency that the code imports DIRECTLY is a dependency this
  # project has, held open by a packaging decision somebody else is free to
  # change -- and `[standard]`'s membership has changed before.
  #
  # pydantic: angels/api/routes/labels.py, `from pydantic import BaseModel`
  # at module scope. Installed 2.13.5. No v1 or v2 specific idiom appears
  # anywhere in the project, so >=2 is a statement about what it runs on
  # rather than about what it needs.
  "pydantic>=2.0",
  # websockets: angels/adapters/maritime/aisstream.py calls
  # websockets.connect in the LIVE maritime collector. Installed 17.1. The
  # floor is 14 because that is the release where `websockets.connect`
  # resolved to the asyncio implementation this code is exercised against;
  # claiming support below it would claim the legacy implementation nobody
  # here has tested. The call passes ping_interval, max_size and compression
  # only -- all three valid in both -- so no deprecated keyword is in use.
  "websockets>=14.0",
]

[project.optional-dependencies]
# Phase 4. Heavy geospatial stack, not needed to run the app.
analysis = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pandas>=2.2",
  "numpy>=1.26",
  "esda>=2.5",
  "libpysal>=4.10",
  "pointpats>=2.4",
  "movingpandas>=0.18",
  "matplotlib>=3.8",
]
# Phase 2. The inversion classifier.
ml = ["scikit-learn>=1.4"]
# Phase 3. SAR.
sar = ["rasterio>=1.3"]
# Phase 5.
forensics = ["pvlib>=0.11", "pillow>=10.0"]
# Phase G. GTFS-Realtime is protobuf, and two separate questions forced this
# rather than one preference choosing it. The feed's update cadence cannot be
# measured from response digests -- a server that stamps its header at
# generation returns a different body to every request whether or not a
# vehicle moved -- so the header has to be read. And one feed stored raw is
# 203 MiB a day, measured, so the archive has to hold the handful of columns
# the analysis needs rather than whole bodies, which means decoding them.
roads = ["gtfs-realtime-bindings>=1.0"]

dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["angels*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
